name: 닌텐도 뉴스 알림

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 기록 불러오기
        run: |
          git fetch origin +refs/heads/data:refs/remotes/origin/data || true
          if git show origin/data:seen.json > /tmp/seen.json 2>/dev/null; then
            cp /tmp/seen.json seen.json
          fi
      - name: 뉴스 확인 및 전송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
        run: python rss_to_discord.py
      - name: 기록 저장 (data 브랜치)
        run: |
          [ -f seen.json ] || exit 0
          cp seen.json /tmp/seen.json
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          if git rev-parse -q --verify origin/data >/dev/null; then
            git checkout -q -f -B data origin/data
          else
            git checkout -q -f --orphan data
            git rm -rf -q --cached .
          fi
          cp /tmp/seen.json seen.json
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -q -m "update seen"
          git push -q origin data